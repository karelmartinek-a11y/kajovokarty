[build-system]
requires = ["setuptools==75.8.2", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "kajovokarty"
version = "1.1.0"
description = "KájovoKarty – lokální desktopová aplikace pro kontrolu úhrad hotelu"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {text = "Proprietary"}
authors = [{name = "Karel"}]
dependencies = [
  "PySide6==6.10.1",
  "httpx==0.28.1",
  "openpyxl==3.1.5",
  "xlrd==2.0.1",
  "python-dateutil==2.9.0.post0",
  "platformdirs==4.3.8",
  "cryptography==45.0.5",
  "pywin32==310; sys_platform == 'win32'",
  "reportlab==4.4.2",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "pytest-qt==4.5.0",
  "mypy==1.17.0",
  "ruff==0.12.3",
  "types-python-dateutil==2.9.0.20250708",
  "pyinstaller==6.14.2",
]

[project.scripts]
kajovokarty = "kajovokarty.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
  "ui: tests requiring PySide6 and a display/offscreen plugin",
  "windows: tests requiring Windows",
  "integration: integration tests",
]

[tool.ruff]
target-version = "py311"
line-length = 110
src = ["src", "tests", "scripts"]
exclude = ["build", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F821", "F822", "F823"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"scripts/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.11"
strict = false
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
warn_return_any = false
mypy_path = "src"
exclude = ["build"]
plugins = []

[[tool.mypy.overrides]]
module = ["PySide6.*", "openpyxl.*", "xlrd.*", "reportlab.*", "win32crypt"]
ignore_missing_imports = true
